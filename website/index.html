<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gearonimo — Coming soon</title>
<style>
  :root{
    --primary:#1b5e34;
    --primary-light:#2e8b50;
    --accent:#ffb300;
    --bg:#f3f5f3;
    --text:#1c1c1c;
    --muted:#5d6b63;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff;
    background:linear-gradient(160deg, var(--primary) 0%, var(--primary-light) 100%);
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:520px;
    text-align:center;
  }
  .logo{
    font-size:40px;
    font-weight:800;
    letter-spacing:1px;
    margin:0 0 12px;
  }
  .tagline{
    font-size:18px;
    color:#eaf3ec;
    margin:0 0 32px;
    line-height:1.5;
  }
  .badge{
    display:inline-block;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.35);
    border-radius:999px;
    padding:6px 18px;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:28px;
  }
  .extra{
    font-size:14px;
    color:#dcebe1;
    margin:0 0 36px;
  }
  .contact{
    font-size:15px;
  }
  .contact a{
    color:#fff;
    font-weight:600;
    text-decoration:none;
    border-bottom:1px solid var(--accent);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Coming soon</div>
    <p class="logo">Gearonimo</p>
    <p class="tagline">Digital inspection platform for PPE and<br>climbing/rigging equipment</p>
    <p class="extra">Also planning support for machinery inspections — let us know if that's relevant for you.</p>
    <p class="contact">Get in touch: <a href="mailto:info@gearonimo.net">info@gearonimo.net</a></p>
  </div>
</body>
</html>
